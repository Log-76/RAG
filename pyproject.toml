[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "RAG system indexing the vLLM codebase, answering questions with Qwen/Qwen3-0.6B"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "torch>=2.13.0",
    "transformers>=4.51.0",
    "rank-bm25>=0.2.2",
    "langchain-text-splitters>=0.3.0",
    "tqdm>=4.66.0",
    "fire>=0.6.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
]

[tool.mypy]
exclude = [
    "\\.venv",
    "tests",
    "data",
    "moulinette",
]

[[tool.mypy.overrides]]
module = ["rank_bm25", "langchain_text_splitters", "tokenizer"]
ignore_missing_imports = true

[tool.flake8]
exclude = [
    ".venv",
    "data",
]
